<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reusable Cable Tie Generator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Reusable Cable Tie</h1>
        <p class="subtitle">Parametric · Print-in-place · Replicad</p>

        <form id="params">
          <label>Strap Length <input type="number" name="strapLength" value="180" step="1" min="40" max="400" /></label>
          <label>Strap Width <input type="number" name="strapWidth" value="4.8" step="0.1" min="2.5" max="12" /></label>
          <label>Strap Thickness <input type="number" name="strapThickness" value="1.3" step="0.1" min="0.8" max="3" /></label>

          <label>Head Length <input type="number" name="headLength" value="14" step="0.5" min="8" max="25" /></label>
          <label>Head Width <input type="number" name="headWidth" value="9.5" step="0.5" min="6" max="18" /></label>
          <label>Head Height <input type="number" name="headHeight" value="8" step="0.5" min="5" max="15" /></label>

          <label>Tooth Pitch <input type="number" name="toothPitch" value="1.5" step="0.1" min="0.8" max="3" /></label>
          <label>Tooth Depth <input type="number" name="toothDepth" value="0.6" step="0.05" min="0.2" max="1.5" /></label>
          <label>Clearance <input type="number" name="clearance" value="0.25" step="0.05" min="0.1" max="0.5" /></label>

          <label class="checkbox">
            <input type="checkbox" name="showTeeth" checked /> Show ratchet teeth
          </label>
        </form>

        <button id="download">Download STL</button>
        <div id="status" class="loading">Loading engine…</div>
      </aside>

      <main>
        <canvas id="viewer"></canvas>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
